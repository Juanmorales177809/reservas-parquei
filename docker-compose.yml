services:
  db:
    image: postgres:13
    container_name: reservas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: reservas_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT:-5050}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - application_network
      - database_network
    ports:
      - "${PGADMIN_HOST_PORT:-8085}:${PGADMIN_LISTEN_PORT:-5050}"

# Los servicios backend y frontend se reintroducen al construirlos de nuevo,
# conforme a BK-03 del plan de backend. Se retiraron al eliminar el código anterior,
# porque apuntaban a carpetas que ya no existen y rompían `docker compose up`.
# La base y pgadmin siguen levantando: el volumen conserva las 28 tablas aplicadas.

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-reservas_postgres_data}
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME:-reservas_pgadmin_data}

networks:
  application_network:
    name: ${APPLICATION_NETWORK_NAME:-reservas_application_network}
    driver: bridge
  database_network:
    name: ${DATABASE_NETWORK_NAME:-reservas_database_network}
    driver: bridge
    internal: true
