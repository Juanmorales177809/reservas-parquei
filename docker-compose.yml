services:
  db:
    image: postgres:13
    container_name: reservas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: reservas_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT:-5050}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - application_network
      - database_network
    ports:
      # Atado a loopback A PROPÓSITO. Antes era "8085:5050", que publica en
      # TODAS las interfaces: en el servidor de despliegue eso dejaba una
      # consola de administración de la base con datos reales accesible para
      # cualquiera en la red, con credenciales que ni siquiera figuraban en
      # .env.example (y por lo tanto nadie habia revisado).
      #
      # Para llegar a pgAdmin desde otra máquina, túnel SSH:
      #   ssh -L 8085:127.0.0.1:8085 usuario@servidor
      # y luego http://127.0.0.1:8085 en el navegador local.
      #
      # Si se necesita exponerlo en la red de nuevo, poner
      # PGADMIN_BIND=0.0.0.0 en el .env — pero que sea una decisión
      # explícita y no el valor por defecto.
      - "${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_HOST_PORT:-8085}:${PGADMIN_LISTEN_PORT:-5050}"

  backend:
    build:
      context: ./backend
    container_name: reservas_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/reservas_db}
      SECRET_KEY: ${SECRET_KEY:?La variable SECRET_KEY es obligatoria}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8091}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Correo saliente (app/services/email.py). EMAIL_ENABLED=false por
      # defecto: el resto de estas variables no importan hasta que IT del
      # ITM entregue un buzón real -- ver deploy/README.md y
      # app/services/email.py. En development, SMTP_HOST=mailpit apunta al
      # servicio de abajo (nunca a un buzón real).
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # Supabase Auth: único mecanismo de autenticación (corte total), las
      # tres obligatorias -- config.py::validate() levanta RuntimeError al
      # arrancar si falta alguna.
      SUPABASE_URL: ${SUPABASE_URL:?La variable SUPABASE_URL es obligatoria}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?La variable SUPABASE_SERVICE_ROLE_KEY es obligatoria}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?La variable SUPABASE_JWT_SECRET es obligatoria}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application_network
      - database_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    container_name: reservas_mailpit
    restart: unless-stopped
    # Solo para desarrollo local -- nunca se levanta con `docker compose up`
    # a secas (hace falta `--profile dev`). Este mismo docker-compose.yml es
    # el que converge el agente de CD en el bastión (ver deploy/README.md);
    # sin el profile, un Mailpit inútil terminaría corriendo en producción.
    profiles:
      - dev
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - application_network

  flutter_proxy:
    image: nginx:alpine
    container_name: reservas_flutter_proxy
    restart: unless-stopped
    ports:
      - "${FLUTTER_PROXY_PORT:-8091}:80"
    volumes:
      - ./app_flutter/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app_flutter/build/web:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application_network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-reservas_postgres_data}
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME:-reservas_pgadmin_data}

networks:
  application_network:
    name: ${APPLICATION_NETWORK_NAME:-reservas_application_network}
    driver: bridge
  database_network:
    name: ${DATABASE_NETWORK_NAME:-reservas_database_network}
    driver: bridge
    internal: true
