services:
  db:
    image: postgres:13
    container_name: reservas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: reservas_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT:-5050}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - application_network
      - database_network
    ports:
      - "${PGADMIN_HOST_PORT:-8085}:${PGADMIN_LISTEN_PORT:-5050}"

  backend:
    build:
      context: ./backend
    container_name: reservas_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/reservas_db}
      SECRET_KEY: ${SECRET_KEY:?La variable SECRET_KEY es obligatoria}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8091}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - application_network
      - database_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  flutter_proxy:
    image: nginx:alpine
    container_name: reservas_flutter_proxy
    restart: unless-stopped
    ports:
      - "${FLUTTER_PROXY_PORT:-8091}:80"
    volumes:
      - ./app_flutter/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app_flutter/build/web:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application_network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-reservas_postgres_data}
  pgadmin_data:
    name: ${PGADMIN_VOLUME_NAME:-reservas_pgadmin_data}

networks:
  application_network:
    name: ${APPLICATION_NETWORK_NAME:-reservas_application_network}
    driver: bridge
  database_network:
    name: ${DATABASE_NETWORK_NAME:-reservas_database_network}
    driver: bridge
    internal: true
