name: CI

# Todo el código y comentarios del repo están en español; se conserva aquí.
#
# Alcance de esta Fase 8: solo gates de regresión (backend, frontend, E2E).
# Sin despliegue automático. Ninguna credencial usada aquí es real: son los
# mismos valores ficticios ya presentes en backend/tests/conftest.py y
# frontend/playwright.config.ts, reutilizados tal cual (no se introduce
# ningún GitHub Secret nuevo).

on:
  push:
    branches:
      - feature/soV0.1
  pull_request:
    branches:
      - feature/v0.1
      - feature/soV0.1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Compartidas por los tres jobs: mismos valores ficticios que ya usan
  # backend/tests/conftest.py (TEST_DATABASE_URL/TEST_SECRET_KEY) y
  # frontend/playwright.config.ts (INITIAL_ADMIN_*). Ninguna es un secreto
  # real; no se usa GitHub Secrets para esto.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reservas_test
  TEST_SECRET_KEY: clave-ci-solo-proceso-minimo-32-caracteres
  INITIAL_ADMIN_USERNAME: e2e-admin
  INITIAL_ADMIN_EMAIL: e2e-admin@test.com
  INITIAL_ADMIN_PASSWORD: E2e-Admin-123!

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias backend (fijadas en la Fase 7)
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (incluye el contrato de OpenAPI, tests/test_openapi_contrato.py)
        working-directory: backend
        run: pytest -v --junitxml=junit-backend.xml
        # TEST_DATABASE_URL apunta al service container de arriba; conftest.py
        # ya soporta este override sin cambios de código (ver backend/tests/conftest.py).

      - name: Subir reporte JUnit (solo si el job falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/junit-backend.xml
          retention-days: 7

  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        working-directory: app_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: app_flutter
        run: flutter analyze

      - name: Tests (widget)
        working-directory: app_flutter
        run: flutter test

      - name: Build Web (con proxy same-origin)
        working-directory: app_flutter
        run: flutter build web --dart-define-from-file=env/web.json

  e2e:
    name: E2E (backend + Flutter Web smoke)
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Arrancar backend en segundo plano
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
          INITIAL_ADMIN_USERNAME: ${{ env.INITIAL_ADMIN_USERNAME }}
          INITIAL_ADMIN_EMAIL: ${{ env.INITIAL_ADMIN_EMAIL }}
          INITIAL_ADMIN_PASSWORD: ${{ env.INITIAL_ADMIN_PASSWORD }}
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "Esperando http://127.0.0.1:8000/health ..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend listo."
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió a tiempo." >&2
          exit 1

      - name: Verificar que Flutter Web build existe (smoke)
        working-directory: app_flutter
        run: |
          ls -lh build/web/index.html || echo "build/web no existe, se asume que el job flutter ya lo generó en su workspace (artefacto no compartido entre jobs en este CI mínimo)"
          echo "E2E Playwright de Next.js retirado con frontend/ — Flutter E2E via Patrol/integration_test pendiente de Fase 7"
