name: CI

# Todo el código y comentarios del repo están en español; se conserva aquí.
#
# Gates de regresión: backend (pytest), Flutter (analyze/test/build web) y
# un smoke que levanta el backend y verifica el bundle web.
#
# Este workflow no despliega, pero sí PUBLICA el bundle web como artefacto
# (`flutter-web`): el servidor de despliegue no puede reconstruirlo por su
# cuenta a un costo razonable, y lo baja desde acá. Ver "CD" en
# app_flutter/CLAUDE.md.
#
# Ninguna credencial usada aquí es real: son los mismos valores ficticios
# que backend/tests/conftest.py (no se usa ningún GitHub Secret).

on:
  push:
    branches:
      - feature/soV0.1
  pull_request:
    branches:
      - feature/v0.1
      - feature/soV0.1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Compartidas por los tres jobs: mismos valores ficticios que ya usa
  # backend/tests/conftest.py. Ninguna es un secreto real; no se usa
  # GitHub Secrets para esto.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reservas_test
  TEST_SECRET_KEY: clave-ci-solo-proceso-minimo-32-caracteres
  INITIAL_ADMIN_USERNAME: e2e-admin
  INITIAL_ADMIN_EMAIL: e2e-admin@test.com
  INITIAL_ADMIN_PASSWORD: E2e-Admin-123!

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias backend (fijadas en la Fase 7)
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (incluye el contrato de OpenAPI, tests/test_openapi_contrato.py)
        working-directory: backend
        run: pytest -v --junitxml=junit-backend.xml
        # TEST_DATABASE_URL apunta al service container de arriba; conftest.py
        # ya soporta este override sin cambios de código (ver backend/tests/conftest.py).

      - name: Subir reporte JUnit (solo si el job falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/junit-backend.xml
          retention-days: 7

  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        working-directory: app_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: app_flutter
        run: flutter analyze

      - name: Tests (widget)
        working-directory: app_flutter
        run: flutter test

      - name: Build Web (con proxy same-origin)
        working-directory: app_flutter
        run: flutter build web --dart-define-from-file=env/web.json

      # El bundle es lo único que el servidor de despliegue necesita y no
      # puede obtener de git (`app_flutter/build/` está en .gitignore).
      # Publicarlo acá evita que el bastión tenga que bajar ~1GB de SDK y
      # compilar 5 minutos en cada despliegue. Lo consume el job `e2e` (en
      # vez de recompilar) y el agente de despliegue del servidor.
      #
      # `path` es el DIRECTORIO, no un glob: así el ancestro común que
      # calcula upload-artifact es `build/web` y el zip queda con
      # `index.html` en la raíz. Si alguien agrega una segunda entrada a
      # `path`, el layout del zip cambia y el despliegue deja de encontrar
      # el index.
      #
      # `if-no-files-found: error` no es decorativo: el default es `warn`,
      # y un artefacto vacío se traduce en un 403 de nginx en producción
      # (ya pasó una vez, con el directorio ausente).
      - name: Publicar bundle web
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: app_flutter/build/web
          retention-days: 14
          if-no-files-found: error
          compression-level: 9

  e2e:
    name: E2E (backend + Flutter Web smoke)
    needs: [backend, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Arrancar backend en segundo plano
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
          # Sin INITIAL_ADMIN_*: este job no ejercita login (el E2E real con
          # integration_test/ no corre acá, ver el comentario del paso de
          # smoke más abajo), así que seed_admin_user() no necesita crear un
          # admin. Es deliberado, no un descuido: con INITIAL_ADMIN_USERNAME
          # seteado, seed_admin_user() (app/main.py) intentaría crear el
          # admin también en Supabase vía crear_usuario_confirmado() -- una
          # llamada de red real, sin ningún mock posible (este es un proceso
          # uvicorn real, no pytest), que fallaría contra el SUPABASE_URL
          # ficticio de abajo y tumbaría el lifespan completo.
          #
          # SUPABASE_URL/JWT_SECRET/SERVICE_ROLE_KEY sí son obligatorias
          # igual: config.py::validate() las exige con RuntimeError al
          # importar, sin importar si se van a usar. Mismos valores
          # ficticios que backend/tests/conftest.py -- ningún test ni este
          # smoke le pega a la red real de Supabase.
          SUPABASE_URL: https://proyecto-de-prueba.supabase.co
          SUPABASE_JWT_SECRET: clave-jwt-de-prueba-fase0-minimo-32-caracteres
          SUPABASE_SERVICE_ROLE_KEY: clave-service-role-de-prueba
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "Esperando http://127.0.0.1:8000/health ..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend listo."
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió a tiempo." >&2
          exit 1

      # Antes este job instalaba Flutter de nuevo y recompilaba la Web
      # (~5 min) para producir un bundle idéntico al del job `flutter`, del
      # que solo comprobaba que existiera el index. Ahora descarga aquel:
      # más rápido, y sobre todo valida EL MISMO artefacto que se despliega,
      # no uno equivalente. `needs: [backend, flutter]` garantiza que ya
      # está publicado.
      - name: Descargar bundle web del job flutter
        uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: app_flutter/build/web

      # Comprueba que el artefacto descargado es un bundle servible, no solo
      # que existe un index.html: si cualquiera de estos falta, nginx
      # arranca igual y sirve una página en blanco o un 404 por archivo, que
      # es peor de diagnosticar que un fallo acá.
      #
      # El E2E real (`integration_test/`) NO corre en este job: necesita un
      # runner Windows con Visual Studio (ver "E2E" en app_flutter/CLAUDE.md).
      # La suite de Playwright que este texto mencionaba se eliminó del repo.
      - name: Smoke — el bundle web es servible
        working-directory: app_flutter
        run: |
          set -euo pipefail
          for archivo in index.html main.dart.js flutter_bootstrap.js version.json; do
            if [ ! -s "build/web/$archivo" ]; then
              echo "Falta o está vacío build/web/$archivo" >&2
              exit 1
            fi
            printf '%-24s %s\n' "$archivo" "$(du -h "build/web/$archivo" | cut -f1)"
          done
